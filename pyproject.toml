[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-alt-regime-trader"
version = "8.4.0"
description = "Upbit async dual-track BTC/ALT regime trader"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10",
  "websockets>=13",
  "PyJWT>=2.9",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "numpy>=2.0",
  "aiosqlite>=0.20",
  "python-dotenv>=1.0",
]

[tool.setuptools]
packages = ["trader"]
