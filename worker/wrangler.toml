# 기존 btc-alt-scalper-v7 Cloudflare Worker 인프라를 재사용하는 MASTER MARKET COMPASS V3
name = "btc-alt-scalper-v7"
main = "worker.js"
compatibility_date = "2026-09-16"

# 기존 Worker의 SCALPER_PIN Secret을 그대로 재사용합니다.
# PIN 값을 여기에 적지 마세요.

[triggers]
# 장기투자 시스템은 5분마다 알림을 보낼 필요가 없으므로 1시간마다 자동 점검합니다.
crons = ["0 * * * *"]

# 기존 V7에서 사용하던 KV를 그대로 재사용합니다.
[[kv_namespaces]]
binding = "SCALPER_KV"
id = "b1d33dfeca5440dbba9b76b769c6bf95"

# Cloudflare Dashboard > Workers > Settings > Variables and Secrets > Secrets
# SCALPER_PIN = 기존 V7 PIN
# TELEGRAM_BOT_TOKEN = 기존 Telegram Bot Token
# TELEGRAM_CHAT_ID = 기존 Telegram Chat ID
